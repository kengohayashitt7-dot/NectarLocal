spring.application.name=socialapi

# --- SQLite: the whole database is the single file ./social.db ---
spring.datasource.url=jdbc:sqlite:social.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time, so keep the connection pool at 1.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# "update" creates/alters tables from the entities. Fine for a demo; use Flyway/Liquibase in real apps.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
# HS256 needs a secret of at least 32 bytes. Override with the JWT_SECRET env var; never commit a real one.
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.jwt.ttl-minutes=60
